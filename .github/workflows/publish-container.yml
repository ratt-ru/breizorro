name: Publish Container

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
      - issuue*
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for container
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For version tags: v0.2.1 -> 0.2.1, 0.2
            type=semver,pattern={{version}}
            # For main branch: use 'latest'
            type=raw,value=latest,enable={{is_default_branch}}
            # For issue branch: use 'issue-<branch-name>'
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/issue') }}

      # Build and push
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Only push if it's NOT a pull_request
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
