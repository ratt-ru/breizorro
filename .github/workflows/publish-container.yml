name: Publish Container

on:
  push:
    tags:
      - 'v*.*.*'
      - main
      - updates
    branches:
      - main
      - updates
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for container
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For version tags: v0.2.1 -> 0.2.1, 0.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # For PRs: use branch name (e.g., ghcr.io/ratt-ru/breizorro:updates)
            type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
            # For main branch: use 'latest'
            type=raw,value=latest,enable={{is_default_branch}}
            # For updates branch: use 'updates'
            type=raw,value=updates,enable=${{ github.ref == 'refs/heads/updates' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
