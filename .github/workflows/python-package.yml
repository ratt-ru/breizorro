# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches:
    - main
    tags:
    - "*"
  pull_request:
  schedule:
    - cron: '30 2 * * 1' # Every Monday @ 2h30am UTC

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Install breizorro with all dependencies
      run: uv sync --all-groups --extra all

    - name: Test breizorro command
      run: uv run breizorro --help

    - name: Run pytest tests
      run: uv run pytest breizorro/tests/ -v

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 breizorro --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 breizorro --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Lint with Ruff
      run: |
        uv run ruff check breizorro --show-fixes

    - name: Format check with Ruff
      run: |
        uv run ruff format breizorro --check --line-length 120

    - name: Download test dataset (real FITS file)
      run: |
        curl -L -o mypipelinerun_circinus_p3_3-MFS-image.tar "https://www.dropbox.com/scl/fi/xoaqth4jhjnx098xbegvn/mypipelinerun_circinus_p3_3-MFS-image.tar?rlkey=vdgkz2xpjgpp7v7hjxm7kg6g2&st=isg70eve&dl=1" && tar -xvf mypipelinerun_circinus_p3_3-MFS-image.tar

    - name: Run end-to-end tests
      run: |
        # Basic mask generation
        uv run breizorro -r mypipelinerun_circinus_p3_3-MFS-image.fits --outfile test.mask.fits --outregion test.mask.rgn
        
        # Test with merge, remove islands, and numbering
        uv run breizorro -r mypipelinerun_circinus_p3_3-MFS-image.fits -t 10 --merge test.mask.fits,test.mask.rgn --remove-islands 19,21,14h16m20.3:-65d42m07 --number-islands --outfile test.numbered.fits
        
        # Test catalog generation with centroid fitting (default, most robust)
        uv run breizorro -r mypipelinerun_circinus_p3_3-MFS-image.fits --outcatalog test_centroid.cat --source-fitting centroid --outfile test_centroid.fits
        
        # Test catalog generation with Gaussian fitting
        uv run breizorro -r mypipelinerun_circinus_p3_3-MFS-image.fits --outcatalog test_gaussian.cat --source-fitting gaussian --outfile test_gaussian.fits
        
        # Test radial cutoff feature (beam attenuation)
        uv run breizorro -r mypipelinerun_circinus_p3_3-MFS-image.fits --radial-cutoff 400 --outfile test.radial.fits
        
        # Test dilation and erosion
        uv run breizorro -r mypipelinerun_circinus_p3_3-MFS-image.fits --dilate 3 --outfile test.dilate.fits
        
        # Test fill holes
        uv run breizorro -r mypipelinerun_circinus_p3_3-MFS-image.fits --fill-holes --outfile test.filled.fits

    - name: Install Stimela 2
      run: |
        #uv pip install stimela
        uv pip install -U git+https://github.com/caracal-pipeline/stimela.git  # Remove when stimela is published

    - name: Install Apptainer
      uses: eWaterCycle/setup-apptainer@v2
      with:
        apptainer-version: 1.4.4

    - name: Build breizorro container
      run: |
        docker build -t breizorro:test .

    - name: Build Singularity image
      run: |
        apptainer build /tmp/breizorro-test.sif docker-daemon://breizorro:test

    - name: Test Stimela 2 Integration
      run: |
        cat > /tmp/breizorro-image-override.yml <<'EOF'
        cabs:
          breizorro:
            image:
              path: /tmp/breizorro-test.sif
        EOF
        uv run stimela run -S breizorro::breizorro.yaml /tmp/breizorro-image-override.yml \
          restored-image=mypipelinerun_circinus_p3_3-MFS-image.fits \
          threshold=6.5 \
          outfile=test_mask_stimela.fits
