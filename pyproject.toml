[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breizorro"
version = "0.2.1"
description = "Creates a binary mask given a FITS image"
authors = [
    { name = "Ian Heywood", email = "ian.heywood@physics.ox.ac.uk" },
    { name = "RATT", email = "ratt@ru.ac.za" }
]
readme = "README.rst"
license = { text = "GNU GPL v3" }
requires-python = ">=3.9,<3.13"
keywords = ["Astronomy", "Masking", "Imaging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
    "astropy",
    "numpy",
    "omegaconf",
    "regions>=0.8",
    "scipy>=1.13.1",
    "stimela>=2.0.2"
]

[project.optional-dependencies]
all = ["bokeh", "photutils", "scikit-image"]
gui = ["bokeh"]
catalog = ["photutils", "scikit-image"]

[project.urls]
Homepage = "https://github.com/ratt-ru/breizorro"
Repository = "https://github.com/ratt-ru/breizorro.git"

[project.scripts]
breizorro = "breizorro.main:driver"

[dependency-groups]
tests = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "flake8"
]
docs = [
    "Sphinx>=5.3.0",
    "sphinx-copybutton>=0.5.0",
    "furo>=2022.9.15"
]

[tool.uv]
default-groups = ["tests", "docs"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
ignore = ["E501"]  # Long lines (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
